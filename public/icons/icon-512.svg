<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="djago-amber-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="djago-glow-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#0d0f12" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#262b33" stroke-width="6" />

  <!-- Architectural Geometric Monogram (Scaled by 4x) -->
  <g filter="url(#shadow-512)" transform="scale(4)">
    <!-- Structural Vertical Pillar -->
    <path d="M34 28 L50 28 L50 100 L34 100 Z" fill="url(#djago-amber-512)" />
    
    <!-- Architectural Cantilever Arch (The 'D' curvature) -->
    <path d="M50 28 L74 28 C92 28 104 42 104 64 C104 86 92 100 74 100 L50 100 L50 84 L72 84 C82 84 88 76 88 64 C88 52 82 44 72 44 L50 44 Z" fill="url(#djago-amber-512)" />
    
    <!-- Precision drafting intersection dot -->
    <circle cx="50" cy="28" r="4" fill="#fde68a" />
    <circle cx="104" cy="64" r="3.5" fill="#fde68a" />
    <circle cx="50" cy="100" r="4" fill="#fde68a" />

    <!-- Drafting crossline accent -->
    <line x1="26" y1="64" x2="64" y2="64" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.8" />
  </g>
</svg>
